<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ChatX - Premium Secure Messaging</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="welcomeStep" class="step-container active-step">
  <img src="logo 2.png" alt="ChatX Logo" class="main-logo-w">
  <div class="logo-text" id="t_welcome">Welcome to ChatX</div>
  
  <p class="clean-terms-text" id="t_terms">
    Read our <a href="privacy.html" class="link-text">Privacy Policy</a>. Tap "Agree and continue" to accept the <a href="terms.html" class="link-text">Terms of Service</a>.
  </p>

  <button class="main-btn" onclick="showStep('authStep')" id="t_agree">AGREE AND CONTINUE</button>

  <div class="lang-selector" style="justify-content: center; margin: 30px auto;">
    <span class="material-symbols-outlined" style="font-size: 18px;">language</span>
    <select id="langSelector" onchange="changeLanguage(this.value)">
      <option value="en">English</option>
      <option value="hi">हिन्दी (Hindi)</option>
    </select>
  </div>
</div>

<div id="authStep" class="step-container auth-card" style="display: none;">
  <div class="toggle-box">
    <div class="toggle-bg" id="toggleBg"></div>
    <div class="toggle-btn active" id="loginTab" onclick="switchTab('login')">Login</div>
    <div class="toggle-btn" id="signupTab" onclick="switchTab('signup')">Sign Up</div>
  </div>

  <div id="loginForm">
    <div class="input-group">
      <span class="material-symbols-outlined input-icon">call</span>
      <input type="tel" inputmode="numeric" maxlength="10" id="logPhone" placeholder="Phone Number">
    </div>
    <div class="input-group">
      <span class="material-symbols-outlined input-icon">lock</span>
      <input type="password" id="logPass" placeholder="Password">
      <span class="material-symbols-outlined" onclick="togglePass('logPass')" style="cursor:pointer; font-size:20px; color:#8696a0;">visibility</span>
    </div>
    <div class="forgot-pass" onclick="forgotPassword()" id="t_forgot">Forgot Password?</div>
    <button class="main-btn" id="loginBtn" onclick="loginUser()">Secure Login</button>
  </div>

  <div id="signupForm" style="display: none;">
    <div class="input-group">
      <span class="material-symbols-outlined input-icon">call</span>
      <input type="tel" inputmode="numeric" maxlength="10" id="signPhone" placeholder="Phone Number">
    </div>
    <div class="input-group">
      <span class="material-symbols-outlined input-icon">lock</span>
      <input type="password" id="signPass" placeholder="Create Password (Min 6)">
    </div>
    <div class="input-group">
      <span class="material-symbols-outlined input-icon">lock_reset</span>
      <input type="password" id="signConfirmPass" placeholder="Confirm Password">
    </div>
    <button class="main-btn" id="sendOtpBtn" onclick="requestRealOTP()">Next</button>
  </div>
</div>

<div id="otpStep" class="step-container auth-card" style="display: none;">
  <h2 class="step-title" id="t_verifyTitle">Verify Code</h2>
  <p class="step-desc" id="t_verifyDesc">Enter the 6-digit code sent to your phone.</p>
  <div class="otp-container">
    <input type="tel" inputmode="numeric" maxlength="1" class="otp-input" id="o1" onkeyup="moveNext(this, 'o2', event)">
    <input type="tel" inputmode="numeric" maxlength="1" class="otp-input" id="o2" onkeyup="moveNext(this, 'o3', event)">
    <input type="tel" inputmode="numeric" maxlength="1" class="otp-input" id="o3" onkeyup="moveNext(this, 'o4', event)">
    <input type="tel" inputmode="numeric" maxlength="1" class="otp-input" id="o4" onkeyup="moveNext(this, 'o5', event)">
    <input type="tel" inputmode="numeric" maxlength="1" class="otp-input" id="o5" onkeyup="moveNext(this, 'o6', event)">
    <input type="tel" inputmode="numeric" maxlength="1" class="otp-input" id="o6" onkeyup="moveNext(this, null, event)">
  </div>
  <button class="main-btn" onclick="verifyOTP()" id="t_verifyBtn">Verify Code</button>
  <p class="back-link" onclick="showStep('authStep')" id="t_back">Back</p>
</div>

<div id="profileStep" class="step-container auth-card" style="display: none;">
  <h2 class="step-title" id="t_profTitle">Profile Info</h2>
  <div class="dp-upload-area">
    <img id="previewDP" src="https://ui-avatars.com/api/?name=U&background=00e5ff&color=000&size=150">
    <div class="cam-fab" onclick="document.getElementById('dpInput').click()"><span class="material-symbols-outlined">add_a_photo</span></div>
    <input type="file" id="dpInput" accept="image/*" style="display:none;" onchange="handleDP(event)">
  </div>
  <div class="input-group" style="margin-top: 20px;">
    <span class="material-symbols-outlined input-icon">person</span>
    <input type="text" id="finalName" placeholder="Your Name">
  </div>
  <button class="main-btn" id="createAccBtn" onclick="finishSignup()">Complete Setup</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="script.js"></script>













</body>
      </html>
