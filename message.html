<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ChatX - Messaging</title>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="message.css">
</head>
<body>

  <header class="chat-header">
    <div class="header-left">
      <span class="material-symbols-outlined back-btn" onclick="window.location.href='chat.html'">arrow_back</span>
      <img id="chatUserDp" src="https://ui-avatars.com/api/?name=U&background=00e5ff&color=000" alt="DP">
      <div class="user-info" onclick="alert('Viewing profile...')">
        <h2 id="chatUserName">Loading...</h2>
        <p id="chatUserStatus">Online</p>
      </div>
    </div>
    <div class="header-right">
      <span class="material-symbols-outlined icon" onclick="alert('Video calling...')">videocam</span>
      <span class="material-symbols-outlined icon" onclick="alert('Calling...')">call</span>
      <span class="material-symbols-outlined icon">more_vert</span>
    </div>
  </header>

  <main class="chat-area" id="chatArea">
    <div class="encryption-msg">
      <span class="material-symbols-outlined">lock</span>
      Messages are end-to-end encrypted. No one outside of this chat, not even ChatX, can read or listen to them.
    </div>
    
    <div id="messagesContainer"></div>
  </main>

  <footer class="input-area">
    <div class="input-wrapper">
      <span class="material-symbols-outlined icon emoji-btn">mood</span>
      <input type="text" id="msgInput" placeholder="Message" onkeypress="handleTyping(event)">
      <span class="material-symbols-outlined icon attach-btn">attach_file</span>
      <span class="material-symbols-outlined icon camera-btn">photo_camera</span>
    </div>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
      <span class="material-symbols-outlined" id="sendIcon">mic</span>
    </button>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <script src="message.js"></script>
</body>
</html>
